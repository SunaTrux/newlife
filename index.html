<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新生活おすすめグッズ</title>
<style>
:root{
  --bg:#fbf7f0; --card:#fff; --ink:#3a3330; --sub:#8a7f78; --line:#ece4d8;
  --main:#e8836b; --main-d:#c9644d; --leaf:#7fb08a; --sky:#7aa7d6; --star:#f2b632;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
header{padding:20px 16px 8px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:.04em}
header h1 span{color:var(--main)}
header p{margin:6px 0 0;font-size:12px;color:var(--sub)}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{flex:1;white-space:nowrap;border:none;background:#f1e9dd;color:var(--sub);padding:10px 4px;border-radius:999px;font:inherit;font-size:14px;font-weight:700}
nav button.on{background:var(--main);color:#fff}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#fff;color:var(--main);font-size:11px;line-height:18px}
main{max-width:640px;margin:0 auto;padding:12px 12px 80px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}
.lbl{font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:700}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px}
.chip.on{border-color:var(--main);background:#fdeee9;color:var(--main-d);font-weight:700}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:700;background:var(--main);color:#fff;margin-top:14px}
.btn:active{background:var(--main-d)}
.btn.sub{background:#f1e9dd;color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13px;margin-top:8px}
.horo{background:linear-gradient(135deg,#f3eefe,#fdf0ea);border:none;font-size:13px;line-height:1.7}
.horo b{color:#7a5fc0}
.item{display:flex;gap:10px;align-items:flex-start}
.item .ic{font-size:28px;line-height:1;width:36px;text-align:center;flex:none}
.item .bd{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:15px}
.item .ds{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.6}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.why span{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef5ef;color:#4e8a5c}
.why span.z{background:#f1ecfb;color:#7a5fc0}
.why span.k{background:#fdf3dc;color:#a87a12}
.why span.w{background:#fde4e0;color:#c0473a;font-weight:700}
.why span.w.later{background:#f3eefe;color:#7a5fc0}
.why span.p{background:#eaf2fb;color:#4a7bb0}
.add{flex:none;border:1.5px solid var(--main);background:#fff;color:var(--main);border-radius:10px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700}
.add.done{border-color:var(--leaf);color:var(--leaf)}
input[type=text],input[type=search],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.6}
.row{display:flex;gap:8px}.row>*{flex:1}
.mine .top{display:flex;align-items:center;gap:8px}
.mine .nm{flex:1;font-weight:700;font-size:15px;word-break:break-all}
.star{border:none;background:none;font-size:22px;color:#d9d0c3;padding:0 2px;line-height:1}
.star.on{color:var(--star)}
.bad{border:1.5px solid var(--line);background:#fff;color:#c8bdb2;border-radius:8px;padding:2px 7px;font:inherit;font-size:11px;font-weight:700}
.bad.on{background:#eef0f3;border-color:#9aa3ad;color:#5b6570}
.mine .ep{background:#f6f7f9;border-color:#d9dee4}
.del{border:none;background:none;color:#c8bdb2;font-size:18px;padding:0 4px}
.mine .memo{margin-top:8px;font-size:13px;min-height:auto;font-family:inherit;padding:8px}
.when{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.wbtn{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:3px 9px;font:inherit;font-size:11px}
.wbtn.on.now{background:#fde4e0;color:#c0473a;border-color:#f3b9b0;font-weight:700}
.wbtn.on.later{background:#f3eefe;color:#7a5fc0;border-color:#d3c6f1;font-weight:700}
.from{font-size:11px;color:var(--sky);margin-left:2px}
.cnt{font-size:12px;color:var(--sub);margin:0 0 8px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 8px;line-height:1.8}
.ver{text-align:center;padding:0 0 28px;margin-top:-56px}
.ver button{border:none;background:none;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(58,51,48,.45);z-index:30;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
.hv{margin-bottom:14px}.hv b{font-size:14px}.hv small{color:var(--sub);margin-left:6px}
.hv ul{margin:4px 0 0;padding-left:20px;font-size:13px;line-height:1.7}
.lnk{color:var(--sky);font-weight:700;text-decoration:none;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#3a3330;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg .chip{flex:1;text-align:center}
.person{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.person h3{margin:0 0 4px;font-size:14px;color:var(--main-d)}
.person .lbl{margin-top:8px}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin:6px 0 0}
code{background:#f4efe7;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🌱 新生活<span>おすすめ</span>グッズ</h1>
  <p>あなたにぴったりのグッズを選んで、本当にあって良かったものを集めよう</p>
</header>
<nav>
  <button data-tab="find" class="on">おすすめ</button>
  <button data-tab="all">一覧</button>
  <button data-tab="list">マイリスト<span class="badge" id="badge">0</span></button>
  <button data-tab="share">共有</button>
</nav>
<main>

<!-- おすすめ -->
<section id="find" class="on">
  <div class="card">
    <div class="lbl">人数</div>
    <div class="chips seg" id="peopleChips">
      <button class="chip" data-v="1">ひとり暮らし</button><button class="chip" data-v="2">ふたり暮らし</button>
    </div>
    <div id="persons"></div>
    <div class="lbl">重視すること（任意）</div>
    <div class="chips" id="focusChips"><button class="chip" data-v="eco">♻️ エコ</button><button class="chip" data-v="cheap">💴 安価</button></div>
    <button class="btn" id="go">おすすめを見る</button>
  </div>
  <div id="result"></div>
</section>

<!-- アイテム一覧 -->
<section id="all">
  <div class="card" style="padding:10px">
    <input type="search" id="q" placeholder="🔍 アイテムを検索（例：レンジ、防災、エコ）">
    <div class="chips" id="allFilter" style="margin-top:8px">
      <button class="chip on" data-v="">すべて</button><button class="chip" data-v="eco">♻️ エコ</button><button class="chip" data-v="cheap">💴 安価</button><button class="chip" data-v="1">ひとり向け</button><button class="chip" data-v="2">ふたり向け</button>
    </div>
    <div class="chips" id="whenFilter" style="margin-top:6px">
      <button class="chip on" data-v="">いつでも</button><button class="chip" data-v="now">🚨 入居日から</button><button class="chip" data-v="later">✨ 余裕があれば</button>
    </div>
  </div>
  <p class="cnt" id="allCnt"></p>
  <div id="allItems"></div>
</section>

<!-- マイリスト -->
<section id="list">
  <div class="card">
    <h2>アイテムを追加</h2>
    <input type="text" id="newName" placeholder="例）ロボット掃除機">
    <input type="text" id="newMemo" placeholder="メモ（任意）例）床がいつもきれい" style="margin-top:8px">
    <button class="btn" id="addBtn">追加する</button>
  </div>
  <div class="chips" id="filter" style="margin-bottom:10px">
    <button class="chip on" data-f="all">すべて</button>
    <button class="chip" data-f="good">★ あって良かった</button>
    <button class="chip" data-f="bad">失敗だった</button>
    <button class="chip" data-f="friend">友だちから</button>
    <button class="chip" data-f="now">🚨 入居日から</button>
  </div>
  <p class="cnt" id="cnt"></p>
  <div id="mine"></div>
</section>

<!-- 共有 -->
<section id="share">
  <div class="card">
    <h2>📤 友だちに送る</h2>
    <div class="lbl">あなたの名前（任意）</div>
    <input type="text" id="myName" placeholder="例）わたし">
    <div class="seg chips" id="expMode" style="margin-top:10px">
      <button class="chip on" data-m="good">★だけ</button>
      <button class="chip" data-m="bad">失敗だけ</button>
      <button class="chip" data-m="all">ぜんぶ</button>
    </div>
    <textarea id="exp" readonly></textarea>
    <button class="btn" id="copyBtn">コピーする</button>
    <p class="hint">コピーしたテキストを LINE やメールで送ってね。</p>
  </div>
  <div class="card">
    <h2>📥 友だちのリストを取り込む</h2>
    <textarea id="imp" placeholder="友だちから届いたテキストを貼り付け"></textarea>
    <button class="btn" id="impBtn">取り込む</button>
    <p class="hint">書き方の例（手書きでもOK）<br>
      <code># わたしの新生活リスト</code><br>
      <code>- ★ ✨ ロボット掃除機 : 床がいつもきれい</code><br>
      <code>- タジン鍋 : 野菜を入れてチンするだけ</code><br>
      <code>- ✖ 大きいバスタオル</code><br>
      <code>&nbsp;&nbsp;- 失敗：場所を取って乾かない</code><br>
      ★ は「あって良かった」、✖ は失敗、🚨✨ は買う時期、<code>:</code> のあとはメモです。</p>
  </div>
</section>

</main>
<footer class="ver"><button id="verBtn"></button></footer>
<div class="modal" id="verModal"><div class="sheet">
  <h2>更新履歴</h2><div id="hist"></div>
  <button class="btn sub" id="verClose">閉じる</button>
</div></div>
<div class="toast" id="toast"></div>

const zOf=id=>ZODIAC.find(x=>x[0]===id);
function recommend(){
  const ppl=+state.people, ps=state.persons.slice(0,ppl);
  const els=ps.map(p=>zOf(p.zodiac)).map(z=>z?z[2]:null);
  const genders=ps.map(p=>p.gender);
  return ITEMS.filter(it=>it.p.includes(ppl)).map(it=>{
    let s=1; const why=[];
    // 性格（人ごと）
    it.t.forEach(t=>{
      const who=ps.map((p,i)=>p.persona.includes(t)?i:-1).filter(i=>i>=0);
      if(!who.length)return;
      s+=who.length===2?4.5:3;
      why.push({c:"",t:ppl===1?PERSONA[t]:who.length===2?"ふたりとも"+PERSONA[t]:`${who[0]+1}人目：${PERSONA[t]}`});
    });
    // 星座
    const zm=els.map((e,i)=>e&&it.e.includes(e)?i:-1).filter(i=>i>=0);
    if(zm.length){
      s+=1.5*zm.length;
      why.push({c:"z",t:ppl===1?ELEMENT[els[0]].name+"の星座と相性◎":zm.length===2?"ふたりの星座と相性◎":`${zm[0]+1}人目の星座と相性◎`});
    }
    // 年代（誰かに合えばOK）
    if(ps.some(p=>it.a.includes(+p.age)))s+=1;else s-=1;
    // 性別
    if(it.g){
      const match=genders.map((g,i)=>g===it.g?i:-1).filter(i=>i>=0);
      if(match.length){s+=1;if(ppl===2)why.push({c:"p",t:match.length===2?"ふたりとも使える":`${match[0]+1}人目に`})}
      else if(genders.every(g=>g==="any"))s-=1.5;
      else s-=3;
    }
    (it.c||[]).forEach(c=>{if(state.focus.includes(c))s+=3;why.push({c:"k",t:CATS[c]})});
    if(ppl===2&&it.p.length===1){s+=1.5;why.push({c:"p",t:"ふたり暮らし向け"})}
    if(ppl===1&&it.p.length===1){s+=1;why.push({c:"p",t:"ひとり暮らし向け"})}
    return {...it,s,why};
  }).sort((a,b)=>b.s-a.s||Math.random()-.5);
}
const GOOD_PAIR={fire:["fire","air"],air:["air","fire"],earth:["earth","water"],water:["water","earth"]};
function horoHtml(){
  const ps=state.persons.slice(0,+state.people);
  const zs=ps.map(p=>zOf(p.zodiac));
  if(!zs.some(Boolean))return "";
  if(zs.length===1)return `<div class="card horo">${zs[0][1]} のあなたへ<br>${ELEMENT[zs[0][2]].msg}</div>`;
  let h=zs.map((z,i)=>z?`<b>${i+1}人目</b> ${z[1]}<br>${ELEMENT[z[2]].msg}`:"").filter(Boolean).join("<br><br>");
  if(zs[0]&&zs[1]){
    const a=zs[0][2],b=zs[1][2];
    const msg=a===b?"同じエレメント同士。好みが似ているので、ふたりで選んだものは長く愛用できそう。":
      GOOD_PAIR[a].includes(b)?"お互いを高め合う組み合わせ。それぞれの得意を活かして家事を分担すると◎。":
      "違うタイプ同士。自分にない視点のアイテムを取り入れると、暮らしがぐっと広がります。";
    h+=`<br><br><b>ふたりの相性</b>（${ELEMENT[a].name}×${ELEMENT[b].name}）<br>${msg}`;
  }
  return `<div class="card horo">${h}</div>`;
}

const icon=i=>i.startsWith("svg:")?SVG_ICONS[i.slice(4)]:i;
const itemHtml=it=>`<div class="card item"><div class="ic">${icon(it.i)}</div><div class="bd"><div class="nm">${esc(it.n)}</div><div class="ds">${esc(state.people==="2"&&it.d2?it.d2:it.d)}${it.l?` <a class="lnk" href="${it.l.u}" target="_blank" rel="noopener">${esc(it.l.t)} ↗</a>`:""}</div><div class="why"><span class="w ${it.w}">${WHEN[it.w]}</span>${it.why.map(w=>`<span class="${w.c}">${esc(w.t)}</span>`).join("")}</div></div><button class="add ${inList(it.n)?"done":""}" data-n="${esc(it.n)}">${inList(it.n)?"追加済み":"＋リスト"}</button></div>`;
const FIRST=12,STEP=10;
let allList=[],shown=0;
function showMore(){
  const more=document.getElementById("more"),btn=document.getElementById("moreBtn");
  if(shown===FIRST&&!more.children.length)more.insertAdjacentHTML("beforeend",`<p class="cnt" style="margin-top:16px">そのほかのアイテム</p>`);
  const next=allList.slice(shown,shown+STEP);shown+=next.length;
  more.insertAdjacentHTML("beforeend",next.map(itemHtml).join(""));
  const rest=allList.length-shown;
  if(rest>0)btn.textContent=`そのほかも見る（残り${rest}件）`;else btn.remove();
}
document.getElementById("go").onclick=()=>{
  allList=recommend();shown=Math.min(FIRST,allList.length);
  let h=horoHtml();
  h+=`<p class="cnt">${state.people==="2"?"ふたり":"ひとり"}暮らしのあなたにおすすめ ${shown}品</p>`;
  h+=allList.slice(0,shown).map(itemHtml).join("");
  h+=`<div id="more"></div>`;
  const rest=allList.length-shown;
  if(rest>0)h+=`<button class="btn sub" id="moreBtn">そのほかも見る（残り${rest}件）</button>`;
  const r=document.getElementById("result");r.innerHTML=h;
  r.scrollIntoView({behavior:"smooth"});
  const mb=document.getElementById("moreBtn");if(mb)mb.onclick=showMore;
};
// ===== アイテム一覧 =====
let allF="",whenF="";
function renderAll(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const list=ITEMS.filter(it=>{
    if(allF==="eco"||allF==="cheap"){if(!(it.c||[]).includes(allF))return false}
    else if(allF){if(!it.p.includes(+allF))return false}
    if(whenF&&it.w!==whenF)return false;
    if(!q)return true;
    const hay=[it.n,it.d,it.d2||"",...it.t.map(t=>PERSONA[t]),...(it.c||[]).map(c=>CATS[c]),WHEN[it.w]].join(" ").toLowerCase();
    return q.split(/\s+/).every(w=>hay.includes(w));
  }).map(it=>({...it,why:[...(it.c||[]).map(c=>({c:"k",t:CATS[c]})),...(it.p.length===1?[{c:"p",t:it.p[0]===2?"ふたり暮らし向け":"ひとり暮らし向け"}]:[])]}));
  document.getElementById("allCnt").textContent=`${list.length}件 / 全${ITEMS.length}件`;
  document.getElementById("allItems").innerHTML=list.length?list.map(itemHtml).join(""):`<div class="empty">見つかりませんでした</div>`;
}
document.getElementById("q").addEventListener("input",renderAll);
document.getElementById("allFilter").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;allF=c.dataset.v;
  document.querySelectorAll("#allFilter .chip").forEach(x=>x.classList.toggle("on",x===c));renderAll();
});
document.getElementById("whenFilter").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;whenF=c.dataset.v;
  document.querySelectorAll("#whenFilter .chip").forEach(x=>x.classList.toggle("on",x===c));renderAll();
});
document.getElementById("allItems").addEventListener("click",e=>addFromBtn(e));
document.getElementById("result").addEventListener("click",e=>addFromBtn(e));
function addFromBtn(e){
  const b=e.target.closest(".add");if(!b||b.classList.contains("done"))return;
  const it=ITEMS.find(x=>x.n===b.dataset.n);
  mine.unshift({id:uid(),name:it.n,memo:"",good:false,from:"",w:it.w});save();updateBadge();
  b.classList.add("done");b.textContent="追加済み";toast("マイリストに追加しました");
}

// ===== マイリスト =====
let filter="all";
function updateBadge(){document.getElementById("badge").textContent=mine.length}
document.getElementById("filter").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;filter=c.dataset.f;
  document.querySelectorAll("#filter .chip").forEach(x=>x.classList.toggle("on",x===c));renderMine();
});
function renderMine(){
  const list=mine.filter(m=>filter==="all"||(filter==="good"&&m.good)||(filter==="bad"&&(m.bad||m.fbad))||(filter==="friend"&&m.from)||(filter==="now"&&m.w==="now"));
  const goods=mine.filter(m=>m.good).length,bads=mine.filter(m=>m.bad).length;
  document.getElementById("cnt").textContent=mine.length?`${mine.length}アイテム（★あって良かった ${goods}・失敗 ${bads}）`:"";
  const el=document.getElementById("mine");
  if(!list.length){el.innerHTML=`<div class="empty">${mine.length?"この条件のアイテムはありません":"まだアイテムがありません。<br>おすすめから追加するか、上で自分で追加してね。<br>使ってみて良かったら ★、失敗だったら「失敗」をつけよう。"}</div>`;return}
  el.innerHTML=list.map(m=>`<div class="card mine" data-id="${m.id}">
    <div class="top"><button class="star ${m.good?"on":""}" aria-label="あって良かった">★</button><button class="bad ${m.bad?"on":""}" aria-label="失敗だった">失敗</button>
    <div class="nm">${esc(m.name)}${m.from?`<span class="from">from ${esc(m.from)}${m.fgood?" ★":""}${m.fbad?" 失敗":""}</span>`:""}</div>
    <button class="del" aria-label="削除">✕</button></div>
    <div class="when" >${Object.keys(WHEN).map(k=>`<button class="wbtn ${m.w===k?"on "+k:""}" data-w="${k}">${WHEN[k]}</button>`).join("")}</div>
    <textarea class="memo" rows="1" placeholder="メモ（どこで買った・良かった点など）">${esc(m.memo)}</textarea>
    ${m.bad?`<textarea class="memo ep" rows="2" placeholder="失敗エピソード（何がダメだった？次はどうする？）">${esc(m.ep||"")}</textarea>`:""}</div>`).join("");
}
document.getElementById("mine").addEventListener("click",e=>{
  const card=e.target.closest(".mine");if(!card)return;const m=mine.find(x=>x.id===card.dataset.id);
  if(e.target.closest(".star")){m.good=!m.good;if(m.good)m.bad=false;save();renderMine()}
  if(e.target.closest(".bad")){m.bad=!m.bad;if(m.bad)m.good=false;save();renderMine();
    if(m.bad){const ep=document.querySelector(`.mine[data-id="${m.id}"] .ep`);if(ep&&!ep.value)ep.focus()}}
  const wb=e.target.closest(".wbtn");if(wb){m.w=m.w===wb.dataset.w?"":wb.dataset.w;save();renderMine()}
  if(e.target.closest(".del")){
    if(card.dataset.confirm){mine=mine.filter(x=>x!==m);save();updateBadge();renderMine()}
    else{card.dataset.confirm=1;e.target.textContent="削除？";setTimeout(()=>{if(card.isConnected){delete card.dataset.confirm;e.target.textContent="✕"}},2500)}
  }
});
document.getElementById("mine").addEventListener("input",e=>{
  if(!e.target.classList.contains("memo"))return;
  const m=mine.find(x=>x.id===e.target.closest(".mine").dataset.id);
  if(e.target.classList.contains("ep"))m.ep=e.target.value;else m.memo=e.target.value;save();
});
document.getElementById("addBtn").onclick=()=>{
  const n=document.getElementById("newName"),mm=document.getElementById("newMemo");
  const name=n.value.trim();if(!name){n.focus();return}
  mine.unshift({id:uid(),name,memo:mm.value.trim(),good:false,from:""});save();updateBadge();
  n.value="";mm.value="";renderMine();toast("追加しました");
};

// ===== 共有（マークダウン） =====
let expMode="good";
const myName=document.getElementById("myName");
myName.value=store.get("ssg_name","");
myName.oninput=()=>{store.set("ssg_name",myName.value);renderExport()};
document.getElementById("expMode").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;expMode=c.dataset.m;
  document.querySelectorAll("#expMode .chip").forEach(x=>x.classList.toggle("on",x===c));renderExport();
});
function renderExport(){
  const list=mine.filter(m=>expMode==="all"||(expMode==="good"&&m.good)||(expMode==="bad"&&m.bad));
  const nm=myName.value.trim();
  const flat=t=>t.replace(/\n/g," ");
  let md=`# ${nm?nm+"の":""}${expMode==="good"?"あって良かった":expMode==="bad"?"失敗した":""}新生活グッズ\n\n`;
  md+=list.length?list.map(m=>`- ${m.good?"★ ":""}${m.bad?"✖ ":""}${m.w?WHEN_ICON[m.w]+" ":""}${flat(m.name)}${m.memo?" : "+flat(m.memo):""}${m.bad&&m.ep?"\n  - 失敗：" +flat(m.ep):""}`).join("\n"):`（まだ${expMode==="bad"?"失敗":"★"}のアイテムがありません）`;
  document.getElementById("exp").value=md+"\n";
}
document.getElementById("copyBtn").onclick=async()=>{
  const t=document.getElementById("exp");
  try{await navigator.clipboard.writeText(t.value);toast("コピーしました")}
  catch(e){t.focus();t.select();toast("選択しました。長押しでコピーしてね")}
};
function parseMd(text){
  let from="";const items=[];
  text.split(/\r?\n/).forEach(line=>{
    const f=line.match(/^\s+[-*・]\s*失敗[:：]\s*(.*)$/);
    if(f){if(items.length){const l=items[items.length-1];l.bad=true;l.ep=f[1].trim()}return}
    const h=line.match(/^#\s*(.+?)の/);if(h&&!from){from=h[1].trim();return}
    const m=line.match(/^\s*(?:[-*・]|\d+\.)\s+(.*)$/);if(!m)return;
    let s=m[1].trim(),good=false,bad=false;
    const ck=s.match(/^\[( |x|X)\]\s*/);if(ck){good=ck[1]!==" ";s=s.slice(ck[0].length)}
    if(/^[★☆]/.test(s)){good=s[0]==="★";s=s.slice(1).trim()}
    if(/^[✖×❌]/.test(s)){bad=true;s=s.replace(/^[✖×❌]\uFE0F?\s*/,"")}
    if(s.startsWith("📅")){s="✨"+s.slice(2)}
    let w="";for(const k in WHEN_ICON){if(s.startsWith(WHEN_ICON[k])){w=k;s=s.slice(WHEN_ICON[k].length).replace(/^\uFE0F/,"").trim();break}}
    const sp=s.split(/\s+[:：]\s+|\s+[—–-]{1,2}\s+/);
    const name=sp.shift().replace(/\*\*/g,"").trim();if(!name)return;
    items.push({name,memo:sp.join(" ").trim(),good,bad,ep:"",w});
  });
  return {from,items};
}
document.getElementById("impBtn").onclick=()=>{
  const ta=document.getElementById("imp");const {from,items}=parseMd(ta.value);
  if(!items.length){toast("アイテムが見つかりませんでした");return}
  let add=0;
  items.forEach(it=>{
    const ex=mine.find(m=>m.name===it.name);
    if(ex){ if(it.memo&&!ex.memo.includes(it.memo))ex.memo+=(ex.memo?"\n":"")+(from?from+"：":"")+it.memo; }
    else{mine.push({id:uid(),name:it.name,memo:(it.memo+(it.ep?(it.memo?"\n":"")+"失敗："+it.ep:"")),good:false,fgood:it.good,fbad:it.bad,w:it.w||(ITEMS.find(x=>x.n===it.name)||{}).w||"",from:from||"友だち"});add++}
  });
  save();updateBadge();ta.value="";
  toast(`${add}件追加しました${items.length-add?`（${items.length-add}件は既存にメモを追記）`:""}`);
};

updateBadge();
document.getElementById("verBtn").textContent=`v${VERSION}・更新履歴`;
document.getElementById("hist").innerHTML=HISTORY.map(h=>`<div class="hv"><b>v${h.v}</b><small>${h.d}</small><ul>${h.c.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("");
const vm=document.getElementById("verModal");
document.getElementById("verBtn").onclick=()=>vm.classList.add("on");
document.getElementById("verClose").onclick=()=>vm.classList.remove("on");
vm.onclick=e=>{if(e.target===vm)vm.classList.remove("on")};
</script>
